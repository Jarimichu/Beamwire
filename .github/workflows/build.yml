name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check research wiring
        run: python3 Tools/check_research.py

      - name: Unit tests (beam tracing and power solver)
        run: dotnet test Source/Beamwire.Tests -c Release

      - name: Build for RimWorld 1.4
        run: dotnet build Source/Beamwire/Beamwire.csproj -c Release -p:RimWorldVersion=1.4

      - name: Build for RimWorld 1.5
        run: dotnet build Source/Beamwire/Beamwire.csproj -c Release -p:RimWorldVersion=1.5

      - name: Build for RimWorld 1.6
        run: dotnet build Source/Beamwire/Beamwire.csproj -c Release -p:RimWorldVersion=1.6

      - name: Package mod
        run: |
          mkdir -p dist/Beamwire
          cp -r About Common LoadFolders.xml LICENSE 1.4 1.5 1.6 dist/Beamwire/

      - uses: actions/upload-artifact@v4
        with:
          name: Beamwire
          path: dist/
